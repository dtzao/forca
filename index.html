<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jogo da Forca Premium</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:
radial-gradient(circle at top,#0f3b8f 0%,#071126 45%,#030712 100%);
min-height:100vh;
color:white;
overflow-x:hidden;
}

.container{
max-width:1600px;
margin:auto;
padding:20px;
}

/* TOPO */

.header{
text-align:center;
margin-bottom:25px;
}

.header h1{
font-size:72px;
font-weight:900;
letter-spacing:2px;
}

.header span{
color:#38bdf8;
}

.sub{
font-size:28px;
margin-top:10px;
color:#cbd5e1;
}

/* GRID */

.layout{
display:grid;
grid-template-columns:260px 1fr 280px;
gap:25px;
}

/* CARD */

.card{
background:rgba(8,15,35,.75);
border:1px solid rgba(255,255,255,.08);
border-radius:28px;
backdrop-filter:blur(12px);
box-shadow:
0 0 25px rgba(0,132,255,.18),
inset 0 0 10px rgba(255,255,255,.02);
}

/* ESQUERDA */

.left{
padding:25px;
}

.player-title{
font-size:34px;
font-weight:800;
margin-bottom:25px;
}

.avatar{
width:150px;
height:150px;
border-radius:50%;
background:linear-gradient(135deg,#2563eb,#60a5fa);
display:flex;
justify-content:center;
align-items:center;
font-size:80px;
margin:auto;
margin-bottom:20px;
}

.player-name{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#111827;
color:white;
font-size:18px;
outline:none;
margin-bottom:20px;
}

.info-box{
background:#0f172a;
padding:25px;
border-radius:20px;
text-align:center;
margin-top:20px;
}

.info-box h3{
font-size:22px;
margin-bottom:10px;
color:#38bdf8;
}

.info-box p{
font-size:48px;
font-weight:900;
}

/* CENTRO */

.center{
display:flex;
flex-direction:column;
gap:25px;
}

/* DIFICULDADE */

.difficulty{
padding:35px;
}

.diff-title{
text-align:center;
font-size:30px;
margin-bottom:25px;
}

.diff-buttons{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.diff-btn{
height:140px;
border:none;
border-radius:24px;
font-size:34px;
font-weight:900;
color:white;
cursor:pointer;
transition:.3s;
}

.diff-btn:hover{
transform:translateY(-5px) scale(1.02);
}

.easy{
background:linear-gradient(135deg,#064e3b,#16a34a);
}

.medium{
background:linear-gradient(135deg,#92400e,#f59e0b);
}

.hard{
background:linear-gradient(135deg,#7f1d1d,#ef4444);
}

/* CONTROLES */

.controls{
display:flex;
justify-content:center;
gap:20px;
margin-top:30px;
}

.control-btn{
border:none;
padding:18px 40px;
border-radius:18px;
font-size:24px;
font-weight:800;
cursor:pointer;
color:white;
transition:.3s;
}

.start{
background:linear-gradient(135deg,#2563eb,#3b82f6);
}

.new{
background:linear-gradient(135deg,#7c3aed,#9333ea);
}

.control-btn:hover{
transform:translateY(-4px);
}

/* ÁREA */

.play-area{
display:grid;
grid-template-columns:380px 1fr;
gap:25px;
}

/* FORCA */

.hangman{
padding:25px;
}

.hangman h2{
font-size:32px;
margin-bottom:20px;
}

canvas{
width:100%;
background:#020617;
border-radius:20px;
}

/* GAME */

.game{
padding:25px;
}

.top-info{
display:flex;
justify-content:space-between;
margin-bottom:35px;
font-size:24px;
}

.word{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
margin-bottom:40px;
}

.letter{
width:55px;
height:70px;
border-bottom:5px solid white;
text-align:center;
line-height:70px;
font-size:42px;
font-weight:900;
}

.status{
text-align:center;
font-size:30px;
margin-bottom:35px;
min-height:50px;
}

/* TECLADO */

.keyboard{
display:grid;
grid-template-columns:repeat(9,1fr);
gap:12px;
}

.key{
height:60px;
border:none;
border-radius:16px;
background:#0f172a;
color:white;
font-size:26px;
font-weight:800;
cursor:pointer;
transition:.2s;
}

.key:hover{
background:#2563eb;
transform:translateY(-3px);
}

.key:disabled{
opacity:.4;
cursor:not-allowed;
}

/* RANKING */

.right{
padding:25px;
}

.rank-title{
font-size:36px;
text-align:center;
margin-bottom:25px;
color:#facc15;
font-weight:900;
}

.ranking{
display:flex;
flex-direction:column;
gap:15px;
}

.rank-item{
background:#0f172a;
padding:18px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.rank-item strong{
font-size:20px;
}

.rank-item span{
color:#22c55e;
font-weight:700;
}

/* FOOTER */

.footer{
margin-top:30px;
text-align:center;
font-size:20px;
color:#94a3b8;
}

/* MENSAGEM CENTRAL */

#mensagemFinal{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:90px;
font-weight:900;
text-align:center;
z-index:9999;
display:none;
animation:piscar 1s infinite;
text-shadow:
0 0 20px #fff,
0 0 40px #fff;
pointer-events:none;
}

/* ANIMAÇÃO */

@keyframes piscar{

0%{
opacity:1;
transform:translate(-50%,-50%) scale(1);
}

50%{
opacity:.2;
transform:translate(-50%,-50%) scale(1.1);
}

100%{
opacity:1;
transform:translate(-50%,-50%) scale(1);
}

}

/* RESPONSIVO */

@media(max-width:1400px){

.layout{
grid-template-columns:1fr;
}

.play-area{
grid-template-columns:1fr;
}

.keyboard{
grid-template-columns:repeat(7,1fr);
}

}

@media(max-width:768px){

.header h1{
font-size:42px;
}

.sub{
font-size:20px;
}

.diff-buttons{
grid-template-columns:1fr;
}

.keyboard{
grid-template-columns:repeat(5,1fr);
}

#mensagemFinal{
font-size:50px;
padding:20px;
}

}

</style>
</head>

/* FOGOS */

function fogos(){

const duration=4000;
const end=Date.now()+duration;

(function frame(){

confetti({
particleCount:8,
angle:60,
spread:100,
origin:{x:0}
});

confetti({
particleCount:8,
angle:120,
spread:100,
origin:{x:1}
});

confetti({
particleCount:12,
spread:120,
origin:{x:0.5,y:0.5}
});

if(Date.now()<end){

requestAnimationFrame(frame);

}

})();

}

mensagemFinal.innerHTML=texto;
mensagemFinal.style.color=cor;

setTimeout(()=>{

mensagemFinal.style.display="none";

},4000);

}

nivelAtual=nivel;

iniciado=false;

tempoEl.innerText="00:00";

corretas=[];
erradas=[];

const lista=palavras[nivelAtual];

palavra=
lista[
Math.floor(
Math.random()*lista.length
)
];

criarPalavra();
criarTeclado();
desenhar();
atualizarErros();

statusEl.innerText=
"Clique em COMEÇAR";

}

/* COMEÇAR */

function iniciarJogo(){

if(iniciado) return;

iniciado=true;

statusEl.innerText=
"Boa sorte!";

timer=setInterval(()=>{

tempo++;

let min=
String(
Math.floor(tempo/60)
).padStart(2,"0");

let seg=
String(
tempo%60
).padStart(2,"0");

tempoEl.innerText=
`${min}:${seg}`;

},1000);

}

/* PALAVRA */

function criarPalavra(){

palavraEl.innerHTML="";

palavra.split("").forEach(l=>{

const div=document.createElement("div");

div.className="letter";

div.innerText=
corretas.includes(l)
? l
: "";

palavraEl.appendChild(div);

});

}

/* TECLADO */

function criarTeclado(){

tecladoEl.innerHTML="";

"ABCDEFGHIJKLMNOPQRSTUVWXYZ"
.split("")
.forEach(letra=>{

const btn=document.createElement("button");

btn.className="key";
btn.innerText=letra;

btn.onclick=()=>
clicarLetra(letra,btn);

tecladoEl.appendChild(btn);

});

}

/* CLICK */

function clicarLetra(letra,btn){

if(!iniciado){

statusEl.innerText=
"Clique em COMEÇAR";

return;

}

btn.disabled=true;

if(palavra.includes(letra)){

corretas.push(letra);

}else{

erradas.push(letra);

}

criarPalavra();
desenhar();
atualizarErros();
verificar();

}

/* ERROS */

function atualizarErros(){

errosEl.innerText=
`${erradas.length}/${maxErros}`;

}

/* VERIFICAR */

function verificar(){

const venceu=
palavra.split("")
.every(l=>
corretas.includes(l)
);

if(venceu){

clearInterval(timer);

statusEl.innerText=
"🏆 VOCÊ VENCEU!";

fogos();

mostrarMensagem(
"PARABÉNS!",
"#22c55e"
);

pontos+=Math.max(
200-tempo,
20
);

pontosEl.innerText=pontos;

salvarRanking();

desativar();

}

if(erradas.length>=maxErros){

clearInterval(timer);

statusEl.innerHTML=
`❌ Palavra: ${palavra}`;

fogos();

mostrarMensagem(
"NÃO DESANIME<br>TENTE DE NOVO!",
"#ef4444"
);

desativar();

}

}

/* DESATIVAR */

function desativar(){

document
.querySelectorAll(".key")
.forEach(b=>b.disabled=true);

}

/* RANKING */

function salvarRanking(){

const nome=
document.getElementById("nomeJogador")
.value || "Jogador";

ranking.push({

nome:nome,
pontos:pontos,
tempo:tempo

});

ranking.sort((a,b)=>{

if(b.pontos===a.pontos){

return a.tempo-b.tempo;

}

return b.pontos-a.pontos;

});

ranking=ranking.slice(0,10);

localStorage.setItem(
"ranking",
JSON.stringify(ranking)
);

renderRanking();

}

/* DESENHO */

function desenhar(){

ctx.clearRect(0,0,320,420);

ctx.strokeStyle="#fff";
ctx.lineWidth=5;

/* BASE */

ctx.beginPath();
ctx.moveTo(50,380);
ctx.lineTo(250,380);
ctx.stroke();

/* POSTE */

ctx.beginPath();
ctx.moveTo(90,380);
ctx.lineTo(90,40);
ctx.lineTo(220,40);
ctx.lineTo(220,80);
ctx.stroke();

const e=erradas.length;

/* CABEÇA */

if(e>0){

ctx.beginPath();
ctx.arc(220,110,30,0,Math.PI*2);
ctx.stroke();

}

/* OLHO ESQ */

if(e>1){

ctx.fillStyle="#fff";

ctx.beginPath();
ctx.arc(210,105,3,0,Math.PI*2);
ctx.fill();

}

/* OLHO DIR */

if(e>2){

ctx.beginPath();
ctx.arc(230,105,3,0,Math.PI*2);
ctx.fill();

}

/* NARIZ */

if(e>3){

ctx.beginPath();
ctx.moveTo(220,110);
ctx.lineTo(215,120);
ctx.lineTo(225,120);
ctx.stroke();

}

/* BOCA */

if(e>4){

ctx.beginPath();
ctx.arc(220,126,10,0,Math.PI);
ctx.stroke();

}

/* CORPO */

if(e>5){

ctx.beginPath();
ctx.moveTo(220,140);
ctx.lineTo(220,230);
ctx.stroke();

}

/* BRAÇO ESQ */

if(e>6){

ctx.beginPath();
ctx.moveTo(220,170);
ctx.lineTo(180,200);
ctx.stroke();

}

/* BRAÇO DIR */

if(e>7){

ctx.beginPath();
ctx.moveTo(220,170);
ctx.lineTo(260,200);
ctx.stroke();

}

/* PERNA ESQ */

if(e>8){

ctx.beginPath();
ctx.moveTo(220,230);
ctx.lineTo(190,300);
ctx.stroke();

}

/* PERNA DIR */

if(e>9){

ctx.beginPath();
ctx.moveTo(220,230);
ctx.lineTo(250,300);
ctx.stroke();

}

}

/* INICIAR */

novoJogo();

</script>

</body>
</html>
